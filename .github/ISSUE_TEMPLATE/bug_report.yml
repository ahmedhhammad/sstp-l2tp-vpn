name: Bug report
description: Report a reproducible problem with SARMADI VPN.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include passwords, L2TP pre-shared keys, private certificates, or unredacted logs. Redact server names and usernames if they identify a private service.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0-preview.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - SSTP
        - L2TP/IPsec
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the RAS error code if shown. Remove passwords, PSKs, private hostnames, and usernames.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
